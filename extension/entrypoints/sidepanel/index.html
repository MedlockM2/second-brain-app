<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Firefox's sidebar title: WXT reads it from this title. -->
    <title>Deepn</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- The account saves go to, always in view while linked (TASK-634). -->
    <div id="account" class="account" hidden>
      <span class="account-label" data-msg="linkedAccount"></span>
      <span id="account-email" class="account-email"></span>
    </div>
    <!-- Another account signed in on the web (TASK-638). -->
    <div id="web-account" class="warn" role="alert" hidden>
      <span id="web-account-icon"></span>
      <div class="warn-body">
        <p class="warn-title" data-msg="otherWebAccountTitle"></p>
        <p data-msg="otherWebAccountUsing"></p>
        <p id="web-account-email" class="warn-email"></p>
        <p data-msg="otherWebAccountSavesGo"></p>
        <div class="warn-actions">
          <button id="web-account-switch" class="wbtn primary" type="button" data-msg="otherWebAccountSwitch"></button>
          <button id="web-account-keep" class="wbtn" type="button" data-msg="otherWebAccountKeep"></button>
        </div>
      </div>
    </div>
    <div id="banner" class="banner" role="alert" hidden></div>

    <section id="pair" class="pairing" hidden>
      <span class="logo big"></span>
      <h1 data-msg="pairTitle"></h1>
      <p id="pair-expired" class="status error" hidden data-msg="pairExpired"></p>
      <p id="pair-instructions" class="lp" data-msg="pairOneClick"></p>
      <button id="open-account" class="btn primary" type="button" data-msg="openAccount"></button>
      <form id="rescue">
        <p id="code-instructions" class="lp small" data-msg="pairRescue"></p>
        <input id="email" type="email" autocomplete="email" required data-msg-placeholder="pairEmail" />
        <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required data-msg-placeholder="pairCode" />
        <button class="btn" type="submit" data-msg="pairSubmit"></button>
        <p id="pair-status" class="status error" role="status"></p>
      </form>
    </section>

    <main id="view"></main>
    <footer id="foot"></footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
