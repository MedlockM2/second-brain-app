# Reusable login sub-flow
# Called by other flows that require authentication
appId: com.secondbrainlabs.core

---

# A signed-out launch opens on the welcome carousel; the sign-in screen is
# pushed from its « I already have an account » button.
- extendedWaitUntil:
    visible:
      id: "welcome-sign-in-button"
    timeout: 15000
- tapOn:
    id: "welcome-sign-in-button"

- assertVisible:
    id: "login-email-input"
    optional: false

# Fill in email
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_USER_EMAIL}

# Fill in password
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_USER_PASSWORD}

# Tap Sign In
- tapOn:
    id: "login-submit-button"

# Wait for navigation to inbox (login success)
- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 10000
