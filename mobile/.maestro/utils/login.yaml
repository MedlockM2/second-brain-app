# Reusable login sub-flow
# Called by other flows that require authentication
appId: com.secondbrainlabs.core

---

# A signed-out launch opens directly on the sign-in screen.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

# Fill in email
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_USER_EMAIL}

# Fill in password
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_USER_PASSWORD}

# Tap Sign In
- tapOn:
    id: "login-submit-button"

# A first sign-in after reset_app.yaml goes through the intro first.
- runFlow: finish_intro.yaml

# Wait for navigation to inbox (login success)
- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 10000
