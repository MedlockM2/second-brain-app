# Normalize authentication state between aggregate flows. On iOS, clearing the
# app container does not necessarily remove credentials persisted in Keychain,
# so a relaunch can restore a session and route through app/index.tsx.
appId: com.secondbrainlabs.core

---
# The states a launch can settle on: the sign-in screen, language onboarding
# (restored session without a reading language), the intro, or the tab bar.
- extendedWaitUntil:
    visible:
      id: "login-email-input|language-onboarding-screen|intro-screen|account-tab-button"
    timeout: 30000

# Onboarding has no tab bar, so complete it first to reach a signed-in state
# the sign-out sub-flow can act on.
- runFlow:
    when:
      visible:
        id: "language-onboarding-screen"
    commands:
      - tapOn:
          id: "language-onboarding-continue-button"
      - runFlow: finish_intro.yaml
      - extendedWaitUntil:
          visible:
            id: "inbox-screen"
          timeout: 20000

- runFlow:
    when:
      visible:
        id: "intro-screen"
    file: finish_intro.yaml

- runFlow:
    when:
      visible:
        id: "account-tab-button"
    file: sign_out.yaml
