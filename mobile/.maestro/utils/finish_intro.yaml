# The two-page intro shown once after the first sign-in of a fresh install
# (app/onboarding/intro.tsx). reset_app.yaml clears the app container, so a flow
# that signs in after it meets the intro: walk through it with « Suivant », the
# only way forward, then « C'est parti ». A no-op when the intro is not shown.
appId: com.secondbrainlabs.core

---
- extendedWaitUntil:
    visible:
      id: "intro-screen|inbox-screen"
    timeout: 20000

- runFlow:
    when:
      visible:
        id: "intro-screen"
    commands:
      - tapOn:
          id: "intro-next-button"
      - tapOn:
          id: "intro-start-button"
