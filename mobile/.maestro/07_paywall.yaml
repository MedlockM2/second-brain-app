# Flow 07: RevenueCat paywall smoke test
# Enters through the deep link, because while the beta regime is on (task-429)
# the app has no entry point to enter through: the Account CTA this flow used to
# tap is hidden, and so is every other route to the paywall. What the flow still
# guards is the wiring behind the screen — the three Test Store products matched
# to the three config tiers, and the two store-required legal links — which does
# not stop mattering just because the screen is unreachable for three months.
# When the beta ends, the Account CTA comes back and so does the entry through
# it (`git show ad76b79` has that version). It verifies packages are loaded and
# that closing leaves the screen, and never taps Subscribe.
appId: com.secondbrainlabs.core
tags:
  - critical
  - paywall

---

- runFlow: utils/reset_app.yaml

- runFlow: utils/ensure_logged_out.yaml

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

# iOS asks for confirmation before handing a scheme URL to the app
# ('Open in "Media Summarizer"?'), and without that confirmation the paywall
# never mounts. autoVerify dismisses the dialog; Android opens the scheme
# directly and ignores the flag.
- openLink:
    link: "media-summarizer://paywall"
    autoVerify: true

- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 45000
- assertVisible:
    text: "Choose Your Plan"

# A tier is only rendered when the store has a package to sell for it, so the
# three names being on screen *is* the check that the three Test Store products
# are still wired to the three config tiers. There is no longer an "Unavailable"
# row to assert the absence of: a tier the store cannot sell is not drawn at all.
- assertVisible:
    text: "Reader"
- scrollUntilVisible:
    element:
      text: "Mix"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Mix"
- scrollUntilVisible:
    element:
      text: "Audio-Heavy"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Audio-Heavy"

# One CTA in a sticky footer buys the selected plan, so it is on screen whatever
# the scroll position.
- assertVisible:
    id: "paywall-subscribe-button"

# App Store guideline 3.1.2 and Play's subscription policy both require these two
# links on the purchase screen itself, in the binary. They were missing entirely
# until the paywall rework, so the flow guards them: losing them again is a store
# rejection, not a cosmetic regression.
- scrollUntilVisible:
    element:
      id: "paywall-terms-link"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "paywall-terms-link"
- assertVisible:
    id: "paywall-privacy-link"

# The Close button lives in the fixed header, outside the tier ScrollView, so it
# stays on screen however far the list is scrolled. Asserting it instead of
# scrolling to it also avoids a swipe-down on an iOS sheet, which the system
# reads as a dismissal.
- assertVisible:
    id: "paywall-close-button"
- tapOn:
    id: "paywall-close-button"

# Reached by deep link there is no screen underneath, so closing falls back to
# the inbox (`dismiss` in app/paywall.tsx) rather than returning to a caller.
- extendedWaitUntil:
    notVisible:
      id: "paywall-screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 15000
