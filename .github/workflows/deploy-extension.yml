# Submits the browser extension to the Chrome Web Store and Edge Add-ons when a push
# to main changed what the extension ships. The package is built against dev (the
# beta's API and web app), numbered 1.0.<run number>, then
# extension/scripts/publish_stores.py compares it with what each store last
# accepted and sends it only where it differs. A store still reviewing an earlier
# submission is skipped, marked pending, and caught up by the next push or a
# scheduled run. The store pages (listing, visibility, privacy) are not touched:
# they stay as set in each dashboard.
name: Deploy Extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      # Bundled into the extension (API client, artifacts, chat), and the source of
      # its translations (extension/scripts/messages.py).
      - "packages/core/**"
      - ".github/workflows/deploy-extension.yml"
  # Catches up a store that was skipped because it was still reviewing: without
  # it, the skipped change waits for the next push touching the extension. The
  # `pending` job stops it within seconds when no store is owed a submission, and
  # a retry reuses the package its push built instead of building it again. Same
  # cadence as mobile-beta-distribute.yml.
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

# One submission at a time: two runs racing would both read the same store state.
concurrency:
  group: deploy-extension
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  # Download the package a previous run uploaded (scheduled retries).
  actions: read

env:
  AWS_DEFAULT_REGION: eu-west-3
  AWS_ACCOUNT_ID: "125313707865"
  EXTENSION_API: https://api.dev.deepn.app
  EXTENSION_WEB: https://dev.deepn.app
  # Read by `wxt prepare`, which `npm ci` runs as postinstall; the packaging step
  # sets them again from --api/--web.
  VITE_API_BASE_URL: https://api.dev.deepn.app
  VITE_WEB_APP_ORIGIN: https://dev.deepn.app

jobs:
  # Scheduled run only: reads the store state, and lets `publish` go on only when
  # publish_stores.py marked a store "pending" (skipped while it was reviewing).
  pending:
    name: Is a store owed a submission?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      owed: ${{ steps.state.outputs.owed }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Read the store state
        id: state
        run: |
          STATE=$(aws ssm get-parameter --name /deepn/extension/store-state --query Parameter.Value --output text 2>/dev/null || echo '{}')
          OWED=$(echo "$STATE" | python3 -c 'import json,sys; s=json.load(sys.stdin); print("true" if any(v.get("pending") for v in s.values()) else "false")')
          echo "owed=$OWED" >> "$GITHUB_OUTPUT"
          echo "Store owed a submission: $OWED" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Submit the extension to the stores
    needs: pending
    # `pending` is skipped on push and manual runs, which always go ahead.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.pending.outputs.owed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A scheduled retry submits the package the last push built: the one whose
      # fingerprint publish_stores.py marked pending. Building happens on a push or
      # manual run, or when that artifact is gone (90-day retention).
      - name: Reuse the last built package (scheduled retry)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow deploy-extension.yml --branch main --status success --limit 50 \
            --json databaseId,event --jq '[.[] | select(.event != "schedule")][0].databaseId // empty')
          if [ -n "$RUN" ] && gh run download "$RUN" --name extension-package --dir "$RUNNER_TEMP/package"; then
            PACKAGE=$(ls "$RUNNER_TEMP"/package/deepn-extension-*-chrome.zip)
            echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
            echo "Reused the package of run $RUN: $(basename "$PACKAGE")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No reusable package; building one." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js 22
        if: env.PACKAGE == ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install standalone extension dependencies
        if: env.PACKAGE == ''
        working-directory: extension
        run: npm ci

      - name: Guard — translations match their source
        if: env.PACKAGE == ''
        working-directory: extension
        run: |
          python3 scripts/messages.py
          git diff --exit-code -- public/_locales || {
            echo "::error::extension/public/_locales differ from scripts/messages.py: run it and commit"
            exit 1
          }

      # Stores refuse a version they already have; the run number only grows.
      - name: Number this build
        if: env.PACKAGE == ''
        working-directory: extension
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          echo "Version 1.0.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the distribution package
        if: env.PACKAGE == ''
        working-directory: extension
        run: |
          npm run zip -- --api "$EXTENSION_API" --web "$EXTENSION_WEB"
          PACKAGE=$(ls "$PWD"/.output/delivery/distribution/*/deepn-extension-1.0.${{ github.run_number }}-chrome.zip)
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "BUILT=true" >> "$GITHUB_ENV"

      # Kept for the scheduled retries above.
      - name: Keep the package
        if: env.BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: ${{ env.PACKAGE }}
          retention-days: 90
          if-no-files-found: error

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Guard — dev account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || {
            echo "::error::Assumed role is in account $ACCOUNT, expected dev $AWS_ACCOUNT_ID"
            exit 1
          }

      - name: Submit where the package changed
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          uv run --no-project --python 3.10 \
            --with boto3==1.38.27 --with requests==2.32.4 --with google-auth==2.38.0 \
            python extension/scripts/publish_stores.py --package "$PACKAGE" --commit "$GITHUB_SHA"
