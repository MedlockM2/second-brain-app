openapi: 3.1.0
info:
  title: Canonical Media API Contract
  version: frozen-2026-02-24
  description: >
    Frozen contract baseline for media ingestion, media status, artifact creation,
    and artifact reads. This specification is contract-only for task-19.
servers:
  - url: /
security:
  - BearerAuth: []
paths:
  /api/entitlements/status:
    get:
      operationId: getEntitlementsStatus
      tags: [entitlements]
      responses:
        '200':
          description: Authenticated capacity from the common beta ledger; no minute fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementStatus'
        '401':
          $ref: '#/components/responses/SessionExpired'
  /api/entitlements/forecast:
    post:
      operationId: forecastBudget
      tags: [entitlements]
      description: Read-only reservation estimate. No hold or provider call; actual admission remains atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetForecastRequest'
      responses:
        '200':
          description: An estimate, a per-item refusal, or explicit unavailable state with null figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetForecast'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/media/ingest-url:
    post:
      operationId: ingestMediaUrl
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestUrlRequest'
      responses:
        '200':
          description: Media URL accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/media/upload-url:
    post:
      operationId: createMediaUploadUrl
      tags: [media]
      description: >
        Issue a presigned S3 PUT for one of the three file-carrying ingestion
        flows. No endpoint of this API accepts a file body: requests arrive
        through API Gateway, which base64-encodes the body into the Lambda event,
        so Lambda's 6 MiB payload ceiling caps any HTTP body at 4 718 592 raw
        bytes and the gateway refuses anything larger itself, before FastAPI. The
        client PUTs the bytes straight to S3 and submits the returned key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned PUT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/media/upload:
    post:
      operationId: ingestUploadedDocument
      tags: [media]
      description: >
        Ingest a document or image already uploaded through upload-url
        (target=document). The object is moved to its job-scoped key and parsed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '202':
          description: Document accepted for parsing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '402':
          $ref: '#/components/responses/InsufficientMinutes'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/MissingUpload'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/media/upload-audio:
    post:
      operationId: ingestUploadedAudio
      tags: [media]
      description: >
        Ingest an audio file already uploaded through upload-url (target=audio).
        The duration is read from the object over a presigned GET before the
        quota debit, so an import that is too long is refused before anything is
        committed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAudioRequest'
      responses:
        '202':
          description: Audio accepted for transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAudioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '402':
          $ref: '#/components/responses/InsufficientMinutes'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/MissingUpload'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/media/ingest-shared-content:
    post:
      operationId: ingestSharedContent
      tags: [media]
      description: >
        Ingest content coming from a share sheet. share_type=text carries the
        message inline; share_type=audio carries upload_key, the object uploaded
        through upload-url with target=shared_audio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestSharedContentRequest'
      responses:
        '202':
          description: Shared content accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestSharedContentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '402':
          $ref: '#/components/responses/InsufficientMinutes'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/MissingUpload'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/media/{media_item_id}:
    get:
      operationId: getMediaStatus
      tags: [media]
      parameters:
        - name: media_item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current media status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatusResponse'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMediaItem
      tags: [media]
      description: >
        Remove one item from the caller's library. The item disappears from every
        read surface immediately and is destroyed irreversibly after the grace
        window. Idempotent: an already-deleted item returns 200 with its original
        purge_at. Only path in the system allowed to schedule a library purge.
      parameters:
        - name: media_item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed from the library and scheduled for purge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMediaResponse'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchMediaItem
      tags: [media]
      description: >
        Partial update of one library item: where it is filed, what it is called,
        or both. Which fields the body carries drives the dispatch, not their
        value, so an explicit "folder_id": null (move to Uncategorized) stays
        distinguishable from a body that says nothing about the folder. A body
        carrying neither field is refused with 400. Renaming also refreshes the
        title denormalized onto that media's search chunks; that refresh is
        best-effort and never fails the request. The implementation spells this
        path parameter media_id, which carries the same durable library id.
      parameters:
        - name: media_item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMediaRequest'
      responses:
        '200':
          description: Item updated; the response reports only what the patch touched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchMediaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/artifacts:
    post:
      operationId: createArtifact
      tags: [artifacts]
      description: >
        Every submitted user request creates a fresh entry and a fresh generation,
        even for identical options and sources. Two submitted taps generate and are
        billed twice. Options and the resolved output language are stored on the
        entry, never used to reuse a user generation. Only the backend's automatic
        review_blurb retains same-language shared reuse and is not requestable here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCreateRequest'
      responses:
        '202':
          description: A fresh entry was created, queued for generation or waiting for sources (generation_outcome created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactCreateResponse'
        '400':
          description: Unknown or disabled artifact type, or a scope other than media or folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorResponse'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          description: budget_exhausted or not_entitled; typed budget refusal, without monetary amounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorResponse'
        '404':
          description: Media item or folder not found for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorResponse'
        '422':
          $ref: '#/components/responses/ArtifactRequestRefused'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Artifact generation is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorResponse'
    get:
      operationId: listArtifacts
      tags: [artifacts]
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [media, folder] }
        - name: scope_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Artifact history for the owned media or folder, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/artifacts/{artifact_id}:
    get:
      operationId: getArtifactDetail
      tags: [artifacts]
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetailResponse'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ArtifactNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteArtifact
      tags: [artifacts]
      description: Delete the owner's failed entry from server history; internal previews are not addressable.
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Failed entry removed from history.
        '401':
          $ref: '#/components/responses/SessionExpired'
        '404':
          $ref: '#/components/responses/ArtifactNotFound'
        '409':
          description: artifact_action_conflict; entry changed or is not failed.
  /api/artifacts/{artifact_id}/retry:
    post:
      operationId: retryArtifact
      tags: [artifacts]
      description: >
        Retry the owner's transient failed entry, with stored options and original
        sources. Same id and creation date, new generation revision, normally billed.
        No body. Concurrent or disallowed history actions return artifact_action_conflict.
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: The same entry is queued or waiting for its sources.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactDetailResponse' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '404':
          $ref: '#/components/responses/ArtifactNotFound'
        '409':
          description: artifact_action_conflict; entry no longer permits retry.
        '403':
          description: Beta budget exhausted or account not entitled.
        '503':
          description: Budget or generation service unavailable.
  /api/artifacts/{artifact_id}/content:
    get:
      operationId: getArtifactContent
      tags: [artifacts]
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Stored artifact envelope and immutable output language.
          content:
            application/json:
              schema:
                type: object
                required: [artifact_id, artifact_type, scope, scope_id, status, language, content]
                properties:
                  artifact_id: { type: string }
                  artifact_type: { type: string }
                  scope: { type: string, enum: [media, folder] }
                  scope_id: { type: string }
                  status: { type: string, enum: [ready] }
                  language: { type: [string, 'null'] }
                  content: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '404':
          $ref: '#/components/responses/ArtifactNotFound'
        '409':
          description: >
            artifact_not_ready while queued or generating. artifact_failed is terminal
            until an explicit history action; it carries artifact_id, artifact_error_code,
            retryable, error_params (including a budget reset date), scope, scope_id and
            artifact_type. Clients never recreate the failed request through POST /api/artifacts.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BudgetState:
      type: object
      required: [state, consumed_percent, reserved_percent, available_percent, open_operations, open_reservations, warning_threshold_percent, resets_at]
      properties:
        state:
          type: string
          enum: [available, exhausted, unavailable, closed]
        consumed_percent:
          type: [number, 'null']
          description: Settled consumption only; can exceed 100 after an overrun
        reserved_percent:
          type: [number, 'null']
          description: Current-month holds, not settled consumption
        warning_threshold_percent:
          type: [number, 'null']
          description: Backend configuration threshold, applied to settled consumption only
        available_percent:
          type: [number, 'null']
          minimum: 0
        open_operations:
          type: [integer, 'null']
          minimum: 0
        open_reservations:
          type: [integer, 'null']
          minimum: 0
        resets_at:
          type: string
          format: date-time
          description: Next UTC calendar month; no carry-over or promise that a closed formula reopens
    EntitlementStatus:
      type: object
      required: [user_id, subscription_tier, subscription_status, is_active, is_free_trial, is_beta_access, auto_renew_status, budget]
      properties:
        user_id:
          type: string
        subscription_tier:
          type: [string, 'null']
        subscription_status:
          type: [string, 'null']
        is_active:
          type: boolean
        is_free_trial:
          type: boolean
        is_beta_access:
          type: boolean
        auto_renew_status:
          type: [boolean, 'null']
        budget:
          $ref: '#/components/schemas/BudgetState'
    BudgetForecastRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          enum: [audio_import, document_import, generation, chat_turn]
        duration_seconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        document_units:
          type: [integer, 'null']
          minimum: 1
        document_unit:
          type: string
          enum: [page, sheet]
          default: page
        input_tokens:
          type: [integer, 'null']
          minimum: 1
          description: Complete LLM request including instructions, schema and chat history
        include_translation:
          type: boolean
          default: true
        scope:
          type: [string, 'null']
          enum: [media, folder, null]
        scope_id:
          type: [string, 'null']
          maxLength: 256
        artifact_type:
          type: [string, 'null']
          enum: [summary_short, notes, flashcards, quiz, null]
        parameters:
          type: object
          description: Same options and source selection as POST /api/artifacts
          additionalProperties: true
        conversation_id:
          type: [string, 'null']
          maxLength: 256
        question:
          type: [string, 'null']
          maxLength: 64000
    BudgetForecast:
      type: object
      required: [state, reservation_percent, available_percent, fits_available, refusal, params, resets_at]
      properties:
        state:
          type: string
          enum: [estimated, unavailable, refused]
        reservation_percent:
          type: [number, 'null']
          description: Advisory reservation bound, never final consumption or an admission guarantee
        available_percent:
          type: [number, 'null']
          minimum: 0
        fits_available:
          type: [boolean, 'null']
        refusal:
          type: [string, 'null']
          enum: [budget_exhausted, item_too_large, budget_unavailable, not_entitled, null]
        params:
          type: object
          additionalProperties:
            type: [string, integer]
        resets_at:
          type: string
          format: date-time
    IngestUrlRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
        source_app: { type: string }
        locale: { type: string }
        idempotency_key: { type: string }
        folder_id:
          type: string
          nullable: true
        tag_ids:
          type: array
          items:
            type: string
    IngestUrlResponse:
      type: object
      required: [media_item, processing_job, deduplicated]
      properties:
        media_item:
          $ref: '#/components/schemas/MediaItemContract'
        processing_job:
          $ref: '#/components/schemas/ProcessingJobContract'
        deduplicated:
          type: boolean
        duplicate_of_media_item_id:
          type: string
    UploadUrlRequest:
      type: object
      required: [target, filename, file_size]
      properties:
        target:
          type: string
          enum: [document, audio, shared_audio]
          description: >
            Ingestion flow the file is meant for. Decides the bucket, the accepted
            formats and the size ceiling.
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the file. Its extension decides the format check.
        content_type:
          type: [string, 'null']
          description: >
            MIME type the client will send with the PUT. Required for
            shared_audio, whose format check is MIME-based.
        file_size:
          type: integer
          exclusiveMinimum: 0
          description: >
            Size in bytes, checked against the ceiling before a URL is issued so
            a hopeless transfer never starts. Re-checked from S3 at submission.
    UploadUrlResponse:
      type: object
      required: [upload_url, upload_key, expires_in]
      properties:
        upload_url:
          type: string
          description: >
            Presigned S3 PUT URL. Send the raw bytes to it, no form encoding and
            no Authorization header — the signature is in the URL.
        upload_key:
          type: string
          description: Key to hand back to the ingestion endpoint once the PUT succeeded.
        expires_in:
          type: integer
          description: Validity of the presigned URL, in seconds.
    UploadDocumentRequest:
      type: object
      required: [upload_key]
      properties:
        upload_key:
          type: string
          description: Key returned by POST /api/media/upload-url for target=document.
        folder_id:
          type: [string, 'null']
        tag_ids:
          type: array
          items:
            type: string
    UploadDocumentResponse:
      type: object
      required: [media_item_id, status, source_platform, file_name]
      properties:
        media_item_id: { type: string }
        status: { type: string }
        source_platform: { type: string }
        file_name: { type: string }
    UploadAudioRequest:
      type: object
      required: [upload_key]
      properties:
        upload_key:
          type: string
          description: Key returned by POST /api/media/upload-url for target=audio.
        folder_id:
          type: [string, 'null']
        tag_ids:
          type: array
          items:
            type: string
    UploadAudioResponse:
      type: object
      required: [media_item_id, status, source_platform]
      properties:
        media_item_id: { type: string }
        status: { type: string }
        source_platform: { type: string }
    IngestSharedContentRequest:
      type: object
      required: [share_type, source_platform]
      properties:
        share_type:
          type: string
          enum: [text, audio]
        source_platform: { type: string }
        source_app: { type: [string, 'null'] }
        idempotency_key: { type: [string, 'null'] }
        locale: { type: [string, 'null'] }
        text:
          type: [string, 'null']
          description: Shared message, required for share_type=text.
        content_mime_type:
          type: [string, 'null']
          description: MIME type of the shared audio, required for share_type=audio.
        original_name:
          type: [string, 'null']
          description: File name as the sharing app knew it, used for the title.
        upload_key:
          type: [string, 'null']
          description: >
            Key returned by POST /api/media/upload-url for target=shared_audio.
            Required for share_type=audio.
        folder_id:
          type: [string, 'null']
        tag_ids:
          type: array
          items:
            type: string
    IngestSharedContentResponse:
      type: object
      required: [media_item_id, status, source_platform]
      properties:
        media_item_id: { type: string }
        status: { type: string }
        source_platform: { type: string }
        deduplicated: { type: [boolean, 'null'] }
        duplicate_of_media_item_id: { type: [string, 'null'] }
    MediaStatusResponse:
      type: object
      required: [media_item, processing_job, artifacts]
      properties:
        media_item:
          $ref: '#/components/schemas/MediaItemContract'
        processing_job:
          $ref: '#/components/schemas/ProcessingJobContract'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/MediaArtifactContract'
    DeleteMediaResponse:
      type: object
      required: [status, media_item_id, purge_at, grace_days]
      properties:
        status: { type: string }
        media_item_id:
          type: string
          description: Durable library id that was deleted.
        deleted_at:
          type: [string, 'null']
          description: When the item left the library (ISO-8601 UTC).
        purge_at:
          type: integer
          description: >
            Epoch seconds after which the item and everything it owns are
            destroyed irreversibly.
        grace_days:
          type: integer
          minimum: 0
    PatchMediaRequest:
      type: object
      description: >
        Both properties are optional and independent, but at least one must be
        present: an empty body updates nothing and is refused with 400.
      minProperties: 1
      properties:
        folder_id:
          type: [string, 'null']
          description: >
            Destination folder, null meaning Uncategorized. Absent means the
            patch does not touch the folder.
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: >
            New user-facing title. Trimmed with runs of whitespace collapsed, then
            bounded to 1..120 characters (MAX_TITLE_LENGTH, the same ceiling
            ingestion derives titles under). Blank or whitespace-only is refused
            with 422.
    PatchMediaResponse:
      type: object
      required: [status, media_id]
      properties:
        status: { type: string }
        media_id:
          type: string
          description: Durable library id that was updated.
        folder_id:
          type: [string, 'null']
          description: >
            The folder the item now sits in. Absent on a title-only patch.
        previous_folder_id:
          type: [string, 'null']
          description: >
            The folder it left. Absent on a title-only patch.
        title:
          type: string
          description: >
            The stored title, normalized. Absent when the patch did not touch it.
    ArtifactCreateRequest:
      type: object
      required: [scope, scope_id, artifact_type]
      properties:
        scope:
          type: string
          enum: [media, folder]
        scope_id:
          type: string
          description: Media item id, or folder id.
        artifact_type:
          type: string
          enum: [summary_short, quiz, notes, flashcards]
        parameters:
          $ref: '#/components/schemas/ArtifactGenerationOptions'
    ArtifactGenerationOptions:
      type: object
      additionalProperties: false
      description: >
        The generation options (task-531). Each applies to some types only, and an
        option sent for a type it does not apply to is refused with 422
        invalid_artifact_parameters (reason not_applicable), like an unknown key
        (unknown_parameter) or a value outside its list (invalid_value). A null
        reads as an absent key. An option at its default, and a focus that is empty
        once cleaned, are dropped before the artifact id is computed, so a request
        at the defaults is the request without options. `language` (task-533)
        defaults to the caller's reading language. `source_ids` (folder scope
        only) chooses the sources the generation reads and is never stored in
        the entry's parameters.
      properties:
        length:
          type: [string, 'null']
          enum: [short, medium, long, null]
          default: short
          description: >
            summary_short only. Same schema at every length: short is the digest
            format, medium adds a sentence of explanation to each point, long
            covers the whole material with every source in proportion.
        count:
          type: [string, 'null']
          enum: [fewer, standard, more, null]
          default: standard
          description: >
            quiz and flashcards only. standard lets the material decide; fewer keeps
            the essentials (about half), more reaches the secondary points (about
            double), never by inventing.
        difficulty:
          type: [string, 'null']
          enum: [easy, medium, hard, null]
          default: medium
          description: >
            quiz and flashcards only. easy is direct recall of stated facts, hard
            asks to apply, compare or explain, with plausible quiz distractors.
        focus:
          type: [string, 'null']
          maxLength: 300
          description: >
            Every type. The topic the reader wants favoured, free text of at most
            300 characters once trimmed and its whitespace runs collapsed to one
            space. Passed to the model as the reader's quoted words, never as an
            instruction; when the sources do not treat the topic, the artifact says
            so instead of inventing. No default: absent means no focus.
        source_ids:
          type: [array, 'null']
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: >
            scope=folder only, every artifact_type (task-532). The media_item_ids,
            among the folder's and its subfolders' media, the generation is limited
            to; absent or null means every source of the folder. The resolution is
            restricted before any transcript is read. The selected sources are
            stored separately for preparation and explicit retry. Every creation
            still writes a new entry. Refused with 422
            invalid_artifact_parameters on scope=media (not_applicable), as an empty
            list, a non-string or repeated id (invalid_value), or when an id is not a
            media of this folder or its subfolders in the caller's library
            (not_in_scope); nothing is written or debited.
        language:
          type: [string, 'null']
          examples: [fr, en]
          description: >
            Every type, on a media as on a folder (task-533). The language the
            artifact is written in: one of the reading languages fr, en, es, de,
            it, pt, nl, ja, zh, ar, hi, or any tag that normalizes to one of them
            (EN-US is en); anything else is invalid_value. Defaults to
            the media save's captured reading language, or the current account
            preference for a folder (task-545). The resolved output language is
            stored permanently; profile changes never translate existing artifacts.
            An explicit other language has a server-owned language_pinned marker.
            Neither language nor options deduplicates user requests.
    ArtifactCreateResponse:
      description: The entry the request answers, plus what the request did.
      allOf:
        - $ref: '#/components/schemas/ArtifactDetailResponse'
        - type: object
          required: [generation_outcome]
          properties:
            generation_outcome:
              type: string
              enum: [created]
    ArtifactRefusal:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [error_code, message]
          properties:
            error_code:
              type: string
              enum: [invalid_artifact_parameters, scope_empty, scope_too_large]
            message: { type: string }
            parameter:
              type: string
              description: invalid_artifact_parameters only, the offending key.
            reason:
              type: string
              enum: [unknown_parameter, not_applicable, invalid_value, not_in_scope]
              description: >
                invalid_artifact_parameters only, why the key was refused.
                not_in_scope is a source_ids id that is not a media of the folder.
            source_count: { type: integer, description: scope_too_large only. }
            max_sources: { type: integer, description: scope_too_large only. }
            estimated_tokens: { type: integer, description: scope_too_large only. }
            max_tokens: { type: integer, description: scope_too_large only. }
    ArtifactListResponse:
      type: object
      required: [scope, scope_id, artifacts]
      properties:
        scope: { type: string, enum: [media, folder] }
        scope_id: { type: string }
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactSummaryResponse'
        next_cursor: { type: [string, 'null'] }
    ArtifactSummaryResponse:
      type: object
      required: [artifact_id, artifact_type, status, source_count, created_at, error_params, retryable]
      properties:
        artifact_id: { type: string }
        artifact_type: { type: string, enum: [summary_short, quiz, notes, flashcards] }
        status: { type: string, enum: [queued, generating, ready, failed] }
        title: { type: [string, 'null'] }
        source_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        error_code: { type: [string, 'null'] }
        error_params:
          type: object
          additionalProperties: true
          description: Typed failure figures, including period_end for budget exhaustion.
        retryable: { type: boolean, description: Only transient failed entries permit retry. }
    ArtifactDetailResponse:
      type: object
      required: [artifact_id, artifact_type, status, source_count, created_at, scope, scope_id, sources, request_parameters, error_params, retryable]
      properties:
        artifact_id: { type: string }
        artifact_type:
          type: string
          enum: [summary_short, quiz, notes, flashcards]
        status:
          type: string
          enum: [queued, generating, ready, failed]
        title: { type: [string, 'null'] }
        source_count: { type: integer, minimum: 0 }
        created_at: { type: string }
        completed_at: { type: [string, 'null'] }
        error_code: { type: [string, 'null'] }
        error_params: { type: object, additionalProperties: true }
        retryable: { type: boolean }
        scope:
          type: string
          enum: [media, folder]
        scope_id: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [media_item_id, excluded]
            properties:
              media_item_id: { type: string }
              title: { type: [string, 'null'] }
              language: { type: [string, 'null'] }
              excluded: { type: boolean }
              excluded_reason: { type: [string, 'null'] }
        s3_key: { type: [string, 'null'] }
        request_parameters:
          $ref: '#/components/schemas/ArtifactGenerationOptions'
          description: Stored request options for inspection; explicit retries read them on the server.
    ProcessingJobContract:
      type: object
      required: [job_id, status, progress, created_at, updated_at]
      properties:
        job_id: { type: string }
        status:
          type: string
          enum:
            - pending
            - classifying
            - resolving
            - downloading
            - extracting
            - transcribing
            - ready_for_artifacts
            - completed
            - failed
            - cancelled
        progress:
          type: object
          required: [percentage, stage]
          properties:
            percentage:
              type: integer
              minimum: 0
              maximum: 100
            stage:
              type: string
        created_at: { type: string }
        updated_at: { type: string }
        started_at: { type: string }
        completed_at: { type: string }
        # Stable failure vocabulary (MediaFailureCode). No companion message: the
        # sentence is built client-side from this code. See the "Ingestion failure
        # contract" section of CANONICAL_MEDIA_API_CONTRACT.md.
        error_code:
          type: string
          enum:
            - MEDIA_UNAVAILABLE
            - GEO_RESTRICTED
            - AGE_RESTRICTED
            - LIVE_CONTENT_UNSUPPORTED
            - NO_TRANSCRIBABLE_MEDIA
            - NO_TRANSCRIPT_AVAILABLE
            - POST_TEXT_EMPTY
            - NOT_AN_ARTICLE_PAGE
            - ARTICLE_TEXT_NOT_FOUND
            - DOCUMENT_PARSE_FAILED
            - PROVIDER_UNAVAILABLE
            - PROVIDER_RESULT_INVALID
            - PROVIDER_RATE_LIMITED
            - PROVIDER_TIMED_OUT
            - PROVIDER_AUTH_FAILED
            - PROVIDER_CREDITS_DEPLETED
            - PROVIDER_CONFIG_ERROR
            - BUDGET_EXHAUSTED
            - ITEM_TOO_LARGE
            - BUDGET_UNAVAILABLE
            - INVALID_JOB_MESSAGE
            - SUBMISSION_FAILED
            - UNEXPECTED_ERROR
    MediaItemContract:
      type: object
      required:
        [media_item_id, media_key, original_url, normalized_url, media_type, source_platform, status, transcript, artifact_statuses, created_at, updated_at]
      properties:
        media_item_id: { type: string }
        media_key: { type: string }
        original_url: { type: string }
        normalized_url: { type: string }
        media_type:
          type: string
          enum: [podcast_episode, article, youtube_video, short_video, image_post, audio_file, shared_text, unknown]
        source_platform:
          type: string
          enum: [spotify, apple_podcasts, deezer, rss, podcast_index, youtube, instagram, tiktok, x, whatsapp, notes, web, direct_url, unknown]
        status:
          type: string
          enum: [ingested, resolving, processing, ready_for_artifacts, failed, cancelled]
        transcript:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [pending, extracting, transcribing, ready, failed]
            source: { type: string }
            language: { type: string }
            segments_count: { type: integer, minimum: 0 }
            duration_seconds: { type: number, minimum: 0 }
        artifact_statuses:
          type: object
          additionalProperties: true
        created_at: { type: string }
        updated_at: { type: string }
    MediaArtifactContract:
      type: object
      required: [artifact_id, media_item_id, artifact_type, status, parameters, created_at, updated_at]
      properties:
        artifact_id: { type: string }
        media_item_id: { type: string }
        artifact_type:
          type: string
          enum: [summary_short, quiz, notes, flashcards]
        status:
          type: string
          enum: [queued, generating, ready, failed]
        parameters:
          type: object
          additionalProperties: true
        content:
          type: object
          additionalProperties: true
        error_code: { type: string }
        error_message: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        completed_at: { type: string }
    CanonicalErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
        detail: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    SessionExpired:
      description: Authentication required or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    NotAuthorized:
      description: Resource access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    MediaNotFound:
      description: Media item not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    ArtifactNotFound:
      description: Artifact not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    ValidationError:
      description: Payload validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    ArtifactRequestRefused:
      description: >
        Typed refusal of a generation request: invalid_artifact_parameters (an
        option the type or the scope cannot take, or a source_ids the folder cannot
        satisfy), scope_empty, or scope_too_large. Nothing is written and nothing is
        debited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArtifactRefusal'
    PayloadTooLarge:
      description: >
        Declared or stored size above the ceiling for that target. Pronounced when
        the presigned URL is requested and again from the stored object at
        submission — never from an HTTP body, which no upload endpoint carries.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    MissingUpload:
      description: >
        No object at the submitted upload_key — the PUT never happened, the key
        expired, or it was already consumed by an earlier submission. Same status
        when S3 reports no digest of the uploaded bytes to build the file's content
        identity from (multipart upload, KMS or client-supplied encryption key):
        the reason is in the X-Upload-Error-Code header
        (upload_fingerprint_multipart, upload_fingerprint_encrypted,
        upload_fingerprint_missing) and the fix is to send the file again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    InsufficientMinutes:
      description: Not enough minutes/quota
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CanonicalErrorResponse'
